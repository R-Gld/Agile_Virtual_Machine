stages:
  - sonarqube-check
  - build
  - test
  - package
  - deploy

default:
  image: maven:3.9.9-eclipse-temurin-21-alpine
  tags:
    - avm_groupe7

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -V -ntp -T 1C"

cache:
  key: "m2-${CI_COMMIT_REF_SLUG}"
  policy: pull-push
  paths:
    - .m2/repository
  when: on_success

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn ${MAVEN_CLI_OPTS} clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 week

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn ${MAVEN_CLI_OPTS} test
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/jacoco.xml
    expire_in: 1 week

package:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn ${MAVEN_CLI_OPTS} -DskipTests package
  artifacts:
    paths:
      - target/*.jar

sonarqube-check:
  stage: sonarqube-check
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "sonar-cache"
    policy: pull-push
    paths:
      - .sonar/cache
  script:
    - mvn ${MAVEN_CLI_OPTS} verify sonar:sonar -Dsonar.projectKey=avm-2025-groupe-7 -Dsonar.projectName='avm-2025-groupe-7'
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'dev'

deploy:
  stage: deploy
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_TAG
  needs:
    - package
  artifacts:
    expire_in: One week
    paths:
      - target/