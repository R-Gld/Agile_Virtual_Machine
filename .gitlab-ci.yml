stages:
  - sonarqube-check
  - build
  - test
  - package
  - deploy

default:
  tags:
    - avm_groupe7

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn clean compile -B
  artifacts:
    paths:
      - target/

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn test -B
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/

package:
  stage: package
  image: maven:3.9.9-eclipse-temurin-21-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'
  script:
    - mvn package -B -DskipTests
  artifacts:
    paths:
      - target/*.jar

sonarqube-check:
  stage: sonarqube-check
  image: maven:3.9.9-eclipse-temurin-21-alpine
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.projectKey=avm-2025-groupe-7 -Dsonar.projectName='avm-2025-groupe-7'
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'dev'

deploy:
  stage: deploy
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - chmod +x settings.sh
    - ./settings.sh
    - mvn -s settings.xml -B -DskipTests=true deploy -DaltDeploymentRepository=nexus-deptinfo::default::${NEXUS_URL}/repository/${NEXUS_REPO}
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_TAG
  needs:
    - package
  artifacts:
    expire_in: One week
    paths:
      - target/